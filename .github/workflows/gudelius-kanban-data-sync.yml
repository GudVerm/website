name: Gudelius Kanban Data Sync

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: gudelius-kanban-data-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'gudelius-beta') || startsWith(github.event.issue.title, '[Gudelius Beta]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Kanban data from GitHub Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'gudelius-beta',
              per_page: 100,
              sort: 'created',
              direction: 'asc'
            });

            const clean = issues
              .filter(issue => !issue.pull_request)
              .map(issue => ({
                number: issue.number,
                title: issue.title,
                body: issue.body || '',
                state: issue.state,
                html_url: issue.html_url,
                labels: (issue.labels || []).map(label =>
                  typeof label === 'string' ? { name: label } : {
                    name: label.name,
                    color: label.color,
                    description: label.description || ''
                  }
                )
              }));

            const payload = {
              generated_at: new Date().toISOString(),
              source: 'GitHub Issues',
              issues: clean
            };

            fs.writeFileSync(
              'kanban/data.json',
              JSON.stringify(payload, null, 2) + '\n'
            );

      - name: Commit updated Kanban data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kanban/data.json
          if git diff --cached --quiet; then
            echo "No Kanban data changes."
          else
            git commit -m "Sync Gudelius Kanban data"
            git push
          fi
