name: Website monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Öffentliche Website prüfen
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 https://gudverm.github.io/website/ -o /tmp/site.html
          grep -q "Gudelius" /tmp/site.html
      - name: Worker-Healthcheck prüfen
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://gudelius-cms.gudeliusvermessung.workers.dev/api/health -o /tmp/health.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));if(!d.ok||d.service!=="gudelius-cms"||!d.release)process.exit(1);console.log("Worker",d.release,"contact_configured=",d.contact_configured)'
      - name: Öffentliche CMS-Datenbank prüfen
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://gudelius-cms.gudeliusvermessung.workers.dev/api/site -o /tmp/site-data.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/site-data.json","utf8"));if(!d.content||typeof d.content!=="object")process.exit(1);console.log("CMS keys:",Object.keys(d.content).length)'
      - name: Zusammenfassung
        if: always()
        run: |
          echo "### Gudelius Website Monitor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: https://gudverm.github.io/website/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: https://gudelius-cms.gudeliusvermessung.workers.dev/api/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Intervall: alle 6 Stunden" >> "$GITHUB_STEP_SUMMARY"
