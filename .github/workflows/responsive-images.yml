name: Responsive image variants

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/responsive-images.yml"
      - "quality/generate-responsive-images.mjs"
      - "assets/media/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: responsive-images-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bildwerkzeug installieren
        run: npm install --no-save --package-lock=false sharp
      - name: Responsive Varianten und srcset erzeugen
        run: node quality/generate-responsive-images.mjs
      - name: Änderungen übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media index.html leistungen projekte technik unternehmen kontakt impressum datenschutz 404.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Keine neuen Bildvarianten erforderlich."
          else
            git commit -m "Responsive Bildvarianten aktualisieren"
            git push
          fi
