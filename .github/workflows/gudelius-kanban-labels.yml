name: Gudelius Kanban Labels

on:
  push:
    paths:
      - ".github/workflows/gudelius-kanban-labels.yml"
  issues:
    types: [opened, edited, closed, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - name: Maintain Gudelius Kanban labels
        uses: actions/github-script@v7
        with:
          script: |
            const definitions = [
              { name: "status: offen", color: "D4C44D", description: "Noch nicht begonnen" },
              { name: "status: in-arbeit", color: "4F8FB0", description: "Aktiv in Bearbeitung" },
              { name: "status: wartet", color: "D7A64A", description: "Wartet auf Zuarbeit oder Abhängigkeit" },
              { name: "status: erledigt", color: "5A9A6A", description: "Abgeschlossen" },
              { name: "verantwortlich: basti", color: "8BC49A", description: "Verantwortlich: Basti" },
              { name: "verantwortlich: jost", color: "8FB5C7", description: "Verantwortlich: Jost" },
              { name: "gudelius-beta", color: "E5C533", description: "Gudelius Version 3 Beta" }
            ];

            for (const label of definitions) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                } else {
                  throw error;
                }
              }
            }

            if (context.eventName !== "issues" || !context.payload.issue) return;

            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const body = issue.body || "";
            const statusLabels = ["status: offen", "status: in-arbeit", "status: wartet", "status: erledigt"];
            const ownerLabels = ["verantwortlich: basti", "verantwortlich: jost"];

            const removeLabels = async (labels) => {
              for (const name of labels) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    name
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            };

            if (context.payload.action === "labeled" && context.payload.label?.name?.startsWith("status: ")) {
              const chosen = context.payload.label.name;
              await removeLabels(statusLabels.filter(x => x !== chosen));

              if (chosen === "status: erledigt" && issue.state !== "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: "closed",
                  state_reason: "completed"
                });
              } else if (chosen !== "status: erledigt" && issue.state === "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: "open"
                });
              }
              return;
            }

            if (context.payload.action === "closed") {
              await removeLabels(statusLabels.filter(x => x !== "status: erledigt"));
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["gudelius-beta", "status: erledigt"]
              });
              return;
            }

            if (context.payload.action === "reopened") {
              await removeLabels(statusLabels.filter(x => x !== "status: offen"));
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["gudelius-beta", "status: offen"]
              });
              return;
            }

            if (context.payload.action === "opened" || context.payload.action === "edited") {
              let status = "status: offen";
              if (/Status:\*{0,2}\s*Wartet/i.test(body)) status = "status: wartet";
              else if (/Status:\*{0,2}\s*In Arbeit/i.test(body)) status = "status: in-arbeit";
              else if (/Status:\*{0,2}\s*Erledigt/i.test(body)) status = "status: erledigt";

              let owner = null;
              if (/Verantwortlich:\*{0,2}\s*Jost/i.test(body)) owner = "verantwortlich: jost";
              else if (/Verantwortlich:\*{0,2}\s*Basti/i.test(body)) owner = "verantwortlich: basti";

              await removeLabels(statusLabels.filter(x => x !== status));
              await removeLabels(ownerLabels.filter(x => x !== owner));

              const add = ["gudelius-beta", status];
              if (owner) add.push(owner);

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: add
              });

              if (status === "status: erledigt" && issue.state !== "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: "closed",
                  state_reason: "completed"
                });
              }
            }
